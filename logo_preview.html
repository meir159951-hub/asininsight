<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { background: #f7f5f2; font-family: -apple-system, sans-serif; padding: 40px; }
    .row { display: flex; flex-direction: column; gap: 40px; }
    .card { background: white; border-radius: 16px; padding: 32px 40px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    .label { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 16px; letter-spacing: 0.05em; text-transform: uppercase; }
    .dark { background: #111827; }
    .dark .label { color: #9ca3af; }
    .logos { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="row">

    <div class="card">
      <div class="label">אפשרות C — העין עם גרף (Insight)</div>
      <div class="logos">
        <img src="logo.svg" height="50">
        <img src="logo.svg" height="36">
        <img src="logo.svg" height="24">
      </div>
    </div>

    <div class="card dark">
      <div class="label">אפשרות C — על רקע כהה</div>
      <img src="logo.svg" height="50">
    </div>

    <div class="card">
      <div class="label">אפשרות B — הברק עם נתונים (Power)</div>
      <div class="logos">
        <img src="logo_b.svg" height="50">
        <img src="logo_b.svg" height="36">
        <img src="logo_b.svg" height="24">
      </div>
    </div>

    <div class="card dark">
      <div class="label">אפשרות B — על רקע כהה</div>
      <img src="logo_b.svg" height="50">
    </div>

  </div>
</body>
</html>
