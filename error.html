<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — ASINInsight</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
    }
    .logo { font-size: 20px; font-weight: 800; color: #0f172a; text-decoration: none; }
    .logo span { color: #2563eb; }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .code { font-size: 96px; font-weight: 900; color: #e2e8f0; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; }
    p { color: #64748b; font-size: 16px; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: #fff;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <nav>
    <a href="/" class="logo">ASIN<span>Insight</span></a>
  </nav>
  <div class="main">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">← Back to Home</a>
  </div>
</body>
</html>
