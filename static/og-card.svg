<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f3ec"/>
      <stop offset="100%" stop-color="#eae5db"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="8" height="630" fill="#1f5fa8"/>

  <!-- Logo -->
  <text x="80" y="110" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#15263d">ASIN</text>
  <text x="222" y="110" font-family="Georgia, serif" font-size="52" font-weight="700" fill="#1f5fa8">Insight</text>

  <!-- Main headline -->
  <text x="80" y="220" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#15263d" letter-spacing="-1">Your Business Report</text>
  <text x="80" y="290" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#15263d" letter-spacing="-1">has the answer.</text>
  <text x="80" y="360" font-family="Georgia, serif" font-size="56" font-weight="700" fill="#1f5fa8" letter-spacing="-1">We tell you which line.</text>

  <!-- Sub text -->
  <text x="80" y="440" font-family="'Segoe UI', Arial, sans-serif" font-size="26" fill="#617184">Upload your CSV. Get the one fix that matters most. 30 seconds.</text>

  <!-- Metric chips -->
  <rect x="80" y="490" width="108" height="44" rx="22" fill="#e8f0fa"/>
  <text x="134" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f5fa8" text-anchor="middle">CTR</text>

  <rect x="202" y="490" width="108" height="44" rx="22" fill="#e8f0fa"/>
  <text x="256" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f5fa8" text-anchor="middle">CVR</text>

  <rect x="324" y="490" width="120" height="44" rx="22" fill="#e8f0fa"/>
  <text x="384" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f5fa8" text-anchor="middle">ACOS</text>

  <rect x="458" y="490" width="148" height="44" rx="22" fill="#e8f0fa"/>
  <text x="532" y="518" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1f5fa8" text-anchor="middle">Buy Box</text>

  <!-- Score card (right side) -->
  <rect x="780" y="140" width="340" height="340" rx="24" fill="#fffdfa" stroke="#ddd4c6" stroke-width="1.5"/>
  <text x="950" y="200" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#617184" text-anchor="middle" letter-spacing="2">DIAGNOSIS RESULT</text>

  <!-- Score circle -->
  <circle cx="950" cy="300" r="72" fill="#f8e8e2" stroke="#9e402e" stroke-width="3"/>
  <text x="950" y="290" font-family="Georgia, serif" font-size="52" font-weight="800" fill="#9e402e" text-anchor="middle">34</text>
  <text x="950" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#9e402e" text-anchor="middle">/ 100</text>

  <!-- Issue label -->
  <rect x="820" y="388" width="260" height="32" rx="16" fill="#f8e8e2"/>
  <text x="950" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#9e402e" text-anchor="middle">CRITICAL: Low CTR (0.12%)</text>

  <!-- URL -->
  <text x="80" y="600" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#94a3b8">asininsight.com</text>
</svg>
