name: Deploy estimate to Pages

on:
  push:
    branches: ["claude/backyard-estimate-pdf-T7Cm8"]
    paths:
      - "backyard_estimate/**"
      - ".github/workflows/estimate-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp backyard_estimate/estimate.html _site/index.html
          cp backyard_estimate/Tarango_Estimate.pdf _site/Tarango_Estimate.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
