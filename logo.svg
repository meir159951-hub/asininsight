<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Eye outer shape -->
  <path d="M4,30 C14,7 46,7 56,30 C46,53 14,53 4,30 Z" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.2"/>

  <!-- Iris -->
  <circle cx="30" cy="30" r="13.5" fill="url(#irisGrad)"/>

  <!-- Rising chart line inside iris -->
  <polyline points="21,37 26,31 31,34 38,22" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Glowing dot at chart peak -->
  <circle cx="38" cy="22" r="3" fill="white"/>
  <circle cx="38" cy="22" r="1.5" fill="#93c5fd"/>

  <!-- Subtle eye shine -->
  <circle cx="24" cy="24" r="2.5" fill="white" opacity="0.25"/>

  <!-- Text: ASIN + Insight -->
  <text x="68" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#111827">ASIN</tspan><tspan fill="#1d4ed8">Insight</tspan>
  </text>
</svg>
