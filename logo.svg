<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <!-- Icon: magnifying glass with bar chart inside -->
  <g transform="translate(8, 8)">
    <!-- Bar chart bars inside circle -->
    <circle cx="22" cy="22" r="16" fill="#1d4ed8" />
    <rect x="13" y="19" width="4" height="8" rx="1" fill="white" opacity="0.9"/>
    <rect x="19" y="15" width="4" height="12" rx="1" fill="white"/>
    <rect x="25" y="17" width="4" height="10" rx="1" fill="white" opacity="0.9"/>
    <!-- Magnifying glass handle -->
    <line x1="34" y1="34" x2="41" y2="41" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Circle outline -->
    <circle cx="22" cy="22" r="16" fill="none" stroke="#1d4ed8" stroke-width="2.5"/>
  </g>

  <!-- Text: ASIN + Insight -->
  <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="800" letter-spacing="-0.03em">
    <tspan fill="#111827">ASIN</tspan><tspan fill="#1d4ed8">Insight</tspan>
  </text>
</svg>
