<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Ariel Outdoor Renovation">

  <!-- Buildings (navy skyscrapers) -->
  <g fill="#1f3a8a">
    <rect x="215" y="120" width="45" height="180" />
    <polygon points="260,60 300,60 300,300 260,300" />
    <polygon points="300,110 345,90 345,300 300,300" />
    <rect x="345" y="150" width="40" height="150" />
    <rect x="385" y="180" width="30" height="120" />
  </g>

  <!-- Red curved arrows (renovation arcs) -->
  <path d="M150,330 Q300,500 450,330"
        fill="none" stroke="#d82b2b" stroke-width="16" stroke-linecap="round" />
  <polygon points="130,318 180,318 160,355" fill="#d82b2b" />
  <polygon points="470,318 420,318 440,355" fill="#d82b2b" />

  <!-- Red house roof (chevron) -->
  <polygon fill="#d82b2b" points="180,325 300,230 420,325 420,345 300,260 180,345" />

  <!-- House body -->
  <rect x="260" y="320" width="80" height="62" fill="#ffffff" stroke="#1f3a8a" stroke-width="3" />
  <!-- Window (4 panes) -->
  <g fill="#1f3a8a">
    <rect x="272" y="332" width="24" height="19" />
    <rect x="304" y="332" width="24" height="19" />
    <rect x="272" y="355" width="24" height="19" />
    <rect x="304" y="355" width="24" height="19" />
  </g>

  <!-- ARIEL text -->
  <text x="300" y="495" text-anchor="middle"
        font-family="Arial Black, Helvetica, sans-serif"
        font-weight="900" font-size="96" letter-spacing="4"
        fill="#1f3a8a">ARIEL</text>

  <!-- OUTDOOR RENOVATION text -->
  <text x="300" y="545" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="700" font-size="34" letter-spacing="6"
        fill="#d82b2b">OUTDOOR RENOVATION</text>
</svg>
