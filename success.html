<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — ASINInsight</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f172a;
      --blue: #2563eb;
      --blue2: #1d4ed8;
      --green: #10b981;
      --green-light: #d1fae5;
      --white: #ffffff;
      --gray: #64748b;
      --light: #f8fafc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--light);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--white);
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(0,0,0,0.10);
    }
    .check-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--green-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 36px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      color: var(--navy);
    }
    p {
      color: var(--gray);
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn {
      display: inline-block;
      background: var(--blue);
      color: var(--white);
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: var(--blue2); transform: translateY(-1px); }
    .note {
      margin-top: 24px;
      font-size: 13px;
      color: var(--gray);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">✓</div>
    <h1>You're all set!</h1>
    <p>Your subscription is now active. You have full access to ASINInsight — unlimited ASIN analysis, portfolio insights, and priority exports — all ready to go.</p>
    <a href="/tool" class="btn">▶ Open ASINInsight</a>
    <p class="note">A receipt has been sent to your email. Questions? Reply to that email anytime.</p>
  </div>
</body>
</html>
